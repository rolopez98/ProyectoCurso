<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios Bucles</title>
    <script>
        // 1. Hacer un bucle que imprima los números de 1 a 20

        for (var i = 1; i <= 20; i++){
            console.log(i);
        }

        // 2. Sumar los números entre 1 y 100 e imprimir el resultado

        var suma = 0;
        for (var i = 1; i <= 100; i++) {
            suma += i;
        }
        console.log(`La suma es ${suma}`);
        
        // 3. FORMA CUTRE DE PONER LAS COSITAS EN LA PAG (VISUAL)
        document.write('<h1>Hola Mundo</h1>');
        document.write(`La suma es ${suma}`);

        // 4. Hacer una lista html
        var contenido = [
            'pera',
            'manzana',
            'platano',
            'uva',
            'ciruela',
            'sandía',
            'cereza',
            'melón',
            'mango',
            'arandano'
        ]
        document.write('<h2>Listado de frutas</h2>')
        document.write("<ul>");
        for(var i = 0; i<10;i++){
                document.write(`<li>${contenido[i]}</li>`);
            }

        document.write("</ul>");

        // LISTADO DE FRUTAS CON ENLACE

        texto = "<ul>";
        for(var i = 0; i<10;i++){
            texto += `<li><a href="#">${contenido[i]}</a></li>`;
        }
        texto += "</ul>";
        document.write(texto);

    </script>
</head>

</body>
</html>
