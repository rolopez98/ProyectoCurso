    <script>
        // var nombre = 'Ro';
        function hola(nombre, edad, horoscopo) {
           // console.log(`Hola ${nombre}, tienes ${edad} años y eres ${horoscopo}`);
            // alert('Hola');

        // Función que sume dos números
        function suma(a, b){
            return a + b;
        }
        var x = suma(19,18);
        console.log(x);
        document.write(`<br>La suma es ${x}`);

        //--------------------SUMA DE ARRAY-------------

        var numeros = [1,2,3,4,5,6,7,8,9];
        function suma_array(sumandos){
            //comprobar entradas
            //hacer el trabajo
            //comprobar salida

            var tmp = 0;
            for(var valor of sumandos){
                tmp = suma(tmp, valor);
            }
            return tmp;
        }
        var x = suma_array(numeros);
        console.log(x)
        document.write(`<br>La suma es ${x}`);

        //-----------------------------

        function capitalize(texto){
            var convertido = texto[0].toUpperCase() + texto.slice(1).toLocaleLowerCase();
            return convertido;
        }
        console.log(capitalize('barBerO'));

        //------------------PASCAL CASE (CONVERTIR)----------------

        function superCapitalize(texto){
            //erase una vez en sevilla -> Erase Una Vez En Sevilla
            var resultado = '';
            var trozos = texto.split(' ');
            
            for(var palabra of trozos){
                resultado += capitalize(palabra) + ' ';
            }
            return resultado; 

        }
    
        var txt = superCapitalize('erase una vez en sevilla');
        console.log(txt);
        document.write('<br>' + txt);

        // Hacer una función que nos indique si un texto tiene vocales

            // var vocales = ['a', 'e', 'i', 'o', 'u'];
            // var v = 'aeiouAEIOU'

        function tieneVocales(texto){
            
            for(var letra of texto) {
                switch(letra){
                    case 'a':
                    case 'e':
                    case 'i':
                    case 'o':
                    case 'u':
                    case 'A':
                    case 'E':
                    case 'I':
                    case 'O':
                    case 'U':
                    return true;
                }
            }
            return false;
        }
        console.log(tieneVocales("crwtgrgh"));
        console.log(tieneVocales("holaaa"));

        //Otra forma de hacerlo:

        function tieneVocales(texto){
            var vocales = 'aeiouAEIOU';
            var salida = false;

            for(var letra of vocales){
                if (texto.indexOf(letra) >= 0){
                    salida = true;
                }
            }
            return salida;

        }
        console.log(tieneVocales('rfwfwfewufaa'));
        console.log(tieneVocales('rffwbbrrr'));

        // if(tieneVocales('ssssuud')){

        // ----------------------------------------------

        //Cuenta vocales
        function cuentaVocales(texto){
            var vocales = 'aeiouAEIOU';
            var contador = 0;
            for(var letra of texto){
                if(vocales.indexOf(letra) >=0){ 
                    contador++
                }
            }
            return contador;
        }
        console.log(cuentaVocales('PIO'));

        //-------------CUENTA VOCALES 2------------------
        function cuentaVocales2(texto){
            var vocales = 'aeiouAEIOU';
            var contador = 0;
            var largo = texto.length;

            for(var i = 0; i < largo; i++){
                if(vocales.indexOf(texto[i]) >=0){ 
                    contador++;
                }
            }
            return contador;
        }
        console.log(cuentaVocales2('PIOOOO'));
