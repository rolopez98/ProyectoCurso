<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="js/49_imc.js" defer></script>
    <title>Indice Masa Corporal</title>
    <style>
        body {
            background-image: url("C:\Users\alumnos\Desktop\ROCIO\ProyectoCurso\imagenes\Captura de pantalla 2025-06-18 202525.png");
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #c0f0e9;
            margin: 30px;
            color: #3d3030;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            background: rgb(255, 255, 255);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 300px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="number"] {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #0e737a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #07306b;
        }

        div {
            margin-top: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            width: 450px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        #resultado {
            font-size: 2rem;
            color: #2c87f0;
            text-align: center;
            margin-top: 10px;
        }
        .bajo{
            background-color: yellow;
        }
        .normal{
            background-color: green;
            color: azure;
        }
        .sobrepeso{
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Calculadora de Indice de Masa Corporal</h1>

    <form id="form_imc" onsubmit="calcularIMC(event)">
        <label for="altura">Altura</label>
        <input type="number" id="altura" placeholder="En Cm" min="0" required />

        <label for="peso">Peso</label>
        <input type="number" id="peso" placeholder="En Kg" min="0" required />

        <button type="submit">Calcular IMC</button>
    </form>

    <div>
        <h4>Tu resultado</h4>
        <h2 id="resultado">0.0</h2>
    </div>

    <div class="colores">
        <h4>Rango de valores</h4>
        <p class="bajo">Peso bajo: Menos de 18.6</p>
        <p class="normal">Normal: Entre 18.6 y 24.9</p>
        <p class="sobrepeso">Sobrepeso: Más de 24.9</p>
    </div>
</body>
</html>
