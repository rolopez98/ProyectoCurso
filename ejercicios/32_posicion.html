<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicion</title>
    <style>
        .contenedor{
            width: 800px;
            height: 800px;
            background-color: rgb(114, 114, 114);
            border: 2px solid red;
            margin: 0 auto;
        }
        .contenedor div{
            width: 200px;
            height: 200px;
            position: relative;
            border: 1px solid blue;
        }
        .caja1{
            background-color: aqua;
            left: 100px;
            top: 100px;
        }
        .caja2{
            background-color: bisque;
            left: 200px;
            top: 200px;
        }
        .caja3{
            background-color: blueviolet;
            left: 300px;
            top: 300px;
        }
    </style>

</head>
<body>
    <div class="contenedor">
        <div class="caja1">
            <h1>1</h1>
        </div>
        <div class="caja2">
            <h1>2</h1>
        </div>
        <div class="caja3">
            <h1>3</h1>
        </div>
    </div>
</body>
</html>
