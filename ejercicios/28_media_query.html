<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media query</title>
    <style>
        .contenedor{
            color: blue;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 28px;
            display: grid;
            grid-template-columns: 1fr 4fr 1fr;
            grid-template-rows: auto 4fr auto;
            height: 90vh;
            width: 80%;
            border: 2px solid black;
            margin: 0 auto;

        }
        
        .uno{
            background-color: rgb(19, 173, 173);

        }
        .dos{

            background-color: rgb(238, 135, 10);
        }
        .tres{
            background-color: rgb(133, 30, 201);

        }
        .menu{
            grid-column: 1 / -1;
            background-color: brown;
            min-height: 5rem;
        }
        
        
        .pie{
            grid-column: 1 / -1;
            background-color: rgb(18, 221, 62);
            min-height: 5rem;
        }

        /* MEDIA QUERY !!! */
        
        @media screen and (max-width: 900px) {
            .contenedor{

            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto;
            width: 80%;
            border: 2px solid black;
            margin: 0 auto;


        }

        .menu{
        
            background-color: rgb(250, 28, 28);
            
        }
            
            .uno{
            background-color: rgb(10, 209, 37);
        

        }
        .dos{

            background-color: rgb(207, 136, 49);
        }
        .tres{
            background-color: rgb(66, 135, 156);

        }
        
        .pie{
           
            background-color: rgb(145, 25, 214);
        
        }
        }
    </style>
</head>
<body>


    <div class="contenedor">
        <div class="menu">menu</div>
        <div class="uno">uno</div>
        <div class="dos">dos</div>
        <div class="tres">tres</div>
        <div class="pie">pie</div>

    </div>
</body>
</html>
