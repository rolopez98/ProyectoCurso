<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signo Zodiacal</title>
</head>
<body>
    <h1>Descubre tu Signo Zodiacal</h1>

    <label for="birthday">Ingresa tu fecha de nacimiento:</label>
    <input type="date" id="birthday">
    <button onclick="obtenerSigno()">Ver Signo</button>

    <h2 id="resultado"></h2>

    <script>
        function obtenerSigno() {
            const fecha = new Date(document.getElementById("birthday").value);
            if (isNaN(fecha)) {
                document.getElementById("resultado").innerText = "Por favor ingresa una fecha válida.";
                return;
            }

            const mes = fecha.getMonth() + 1; // Los meses empiezan desde 0, por eso sumamos 1
            const dia = fecha.getDate();

            let signo = '';

            if ((mes == 3 && dia >= 21) || (mes == 4 && dia <= 19)) {
                signo = "Aries";
            } else if ((mes == 4 && dia >= 20) || (mes == 5 && dia <= 20)) {
                signo = "Tauro";
            } else if ((mes == 5 && dia >= 21) || (mes == 6 && dia <= 20)) {
                signo = "Géminis";
            } else if ((mes == 6 && dia >= 21) || (mes == 7 && dia <= 22)) {
                signo = "Cáncer";
            } else if ((mes == 7 && dia >= 23) || (mes == 8 && dia <= 22)) {
                signo = "Leo";
            } else if ((mes == 8 && dia >= 23) || (mes == 9 && dia <= 22)) {
                signo = "Virgo";
            } else if ((mes == 9 && dia >= 23) || (mes == 10 && dia <= 22)) {
                signo = "Libra";
            } else if ((mes == 10 && dia >= 23) || (mes == 11 && dia <= 21)) {
                signo = "Escorpio";
            } else if ((mes == 11 && dia >= 22) || (mes == 12 && dia <= 21)) {
                signo = "Sagitario";
            } else if ((mes == 12 && dia >= 22) || (mes == 1 && dia <= 19)) {
                signo = "Capricornio";
            } else if ((mes == 1 && dia >= 20) || (mes == 2 && dia <= 18)) {
                signo = "Acuario";
            } else if ((mes == 2 && dia >= 19) || (mes == 3 && dia <= 20)) {
                signo = "Piscis";
            }

            document.getElementById("resultado").innerText = `Tu signo zodiacal es: ${signo}`;
        }
    </script>
</body>
</html>
